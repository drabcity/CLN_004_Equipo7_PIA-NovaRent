
name: NovaRent - Pruebas y CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: novarent-python

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novarent
          POSTGRES_PASSWORD: prueba-local-ci
          POSTGRES_DB: novarent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novarent -d novarent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: novarent-python/pyproject.toml

      - name: Instalar dependencias
        run: python -m pip install -e '.[dev]'

      - name: Pruebas y cobertura
        run: pytest -q --cov=novarent --cov-report=term-missing --cov-fail-under=80

      - name: Pruebas PostgreSQL
        env:
          NOVARENT_TEST_DATABASE_URL: postgresql+psycopg://novarent:prueba-local-ci@localhost:5432/novarent_test
        run: pytest -q tests/test_integracion_sql_api.py

      - name: Validar Docker Compose
        run: docker compose --profile tests config --quiet

